name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:h5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p android :app:assembleDebug
      - name: Verify APK signature and bundled content
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          unzip -Z1 "$apk" > "$RUNNER_TEMP/apk-entries.txt"
          grep -Fx assets/index.html "$RUNNER_TEMP/apk-entries.txt"
          grep -E '^assets/bankpkg[0-9]+/static/q/.+[.]json$' "$RUNNER_TEMP/apk-entries.txt"
          cp "$apk" ruankao-quiz-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ruankao-quiz-debug
          path: ruankao-quiz-debug.apk
          if-no-files-found: error
